<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivor Book</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=442033efb2">
</head>
<body>
<header class="top">
  <div class="brand">Survivor Book</div>
  <select id="week" aria-label="Week"></select>
  <select id="contest" aria-label="Contest"></select>
  <button class="btn ghost small" id="syncBtn" type="button">Sync</button>
</header>
<div id="syncPanel" class="syncpanel" hidden>
  <div id="syncStatus" class="small"></div>
  <div id="syncConnectRow"><input id="syncToken" type="password" autocomplete="off" spellcheck="false" placeholder="GitHub token, gist scope">
    <button class="btn small" id="syncConnect" type="button">Connect</button>
    <span class="muted small">Kept in this browser; sent only to GitHub.</span></div>
  <button class="btn ghost small" id="syncForget" type="button">Disconnect this device</button>
</div>
<main id="main"><p class="muted pad">Loading…</p></main>
<template id="t-contest">
  <section class="contest">
    <div class="head">
      <div>
        <h1 class="cname"></h1>
        <div class="meta muted"></div>
      </div>
      <div class="actions">
        <button class="btn" data-act="autofill" title="Bank every remaining entry on its best option, most valuable first">Auto-fill the rest</button>
        <button class="btn" data-act="check" title="Single swaps that would improve the book by more than two standard errors">Check my book</button>
        <button class="btn ghost" data-act="undo">Undo</button>
        <button class="btn ghost" data-act="reset">Reset</button>
      </div>
    </div>
    <div class="notes"></div>
    <div class="cards"></div>
    <div class="chalkbar"><label>Chalk this week <input class="chalkin" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. BAL MIN SEA BUF IND"></label> <span class="muted small chalknote"></span></div>
    <div class="checkout"></div>
    <div class="grid">
      <div class="col entries">
        <h2>Entries <span class="muted small">worth now, given what is banked</span></h2>
        <ol class="elist todo"></ol>
        <h2 class="bh">Banked</h2>
        <ol class="elist done"></ol>
      </div>
      <div class="col detail"></div>
    </div>
  </section>
</template>
<script src="engine.js?v=83dfade43b"></script>
<script src="app.js?v=a1f2711210"></script>
</body>
</html>
